<title>Sin Falla N4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturCook:wght@700&family=Share+Tech+Mono&family=Shippori+Mincho:wght@500;700;800&display=swap">
<style>
/* Concepto: catedral gótica hackeada. Vitral + terminal. Un solo neón (verde ácido) para datos y aciertos. */
:root{
  --void:#050509; --nave:#0c0b14; --stone:#15131f; --rib:#262236;
  --blood:#c4142f; --blood-hi:#ff3a55; --uv:#8a3dff; --uv-dim:#3b1d73;
  --acid:#a4ff3c; --chrome:#c9ccd8; --ink:#ece8f4; --mute:#9a95b0; --dim:#5f5a75;
  --f-title:"UnifrakturCook","Pirata One",Georgia,serif;
  --f-alt:"Pirata One","UnifrakturCook",Georgia,serif;
  --f-data:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Shippori Mincho",Georgia,serif;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.fx-scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.fx-vig{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.55) 100%);border-radius:18px/14px;box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.fx-flash{position:fixed;inset:0;pointer-events:none;z-index:48;background:var(--blood);opacity:0}
.fx-flash.on{animation:flash 260ms ease-out}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
body.ab .stage{animation:aberr 180ms steps(2)}
@keyframes aberr{0%{filter:drop-shadow(2px 0 0 rgba(255,40,80,.8)) drop-shadow(-2px 0 0 rgba(120,80,255,.8))}100%{filter:none}}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rib);background:linear-gradient(to bottom,rgba(5,5,9,.95),rgba(5,5,9,.7));font-family:var(--f-data);font-size:12px;letter-spacing:.04em;min-height:48px}
.brand{font-family:var(--f-title);font-size:22px;letter-spacing:0;color:var(--chrome);line-height:1;white-space:nowrap}
.brand b{color:var(--blood-hi);font-weight:700}
.count{margin-left:auto;text-align:right;line-height:1.15;white-space:nowrap}
.count .d{color:var(--acid);font-size:18px}
.count small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.12em}
.snd{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rib);background:var(--nave);border-radius:6px;cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:var(--chrome);fill:none;stroke-width:1.6}
.vol{width:64px;accent-color:var(--uv)}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin;scrollbar-color:var(--rib) transparent}
.stage.noscroll{overflow:hidden;display:flex;flex-direction:column}
nav.bottom{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rib);background:rgba(5,5,9,.94);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom button{min-height:var(--nav-h);background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
nav.bottom button[aria-current="page"]{color:var(--acid)}
nav.bottom button[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(164,255,60,.5))}
body.inq nav.bottom{display:none}

h1,h2,h3{text-wrap:balance;margin:0}
.h-title{font-family:var(--f-title);font-weight:700;font-size:30px;line-height:1.05;color:var(--chrome)}
.h-sec{font-family:var(--f-alt);font-size:22px;color:var(--chrome);font-weight:400;letter-spacing:.02em}
.lbl{font-family:var(--f-data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.mono{font-family:var(--f-data)}
.acid{color:var(--acid)} .red{color:var(--blood-hi)} .uv{color:#b48bff} .mute{color:var(--mute)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* panel con esquinas de terminal */
.panel{position:relative;background:linear-gradient(180deg,rgba(21,19,31,.92),rgba(12,11,20,.92));border:1px solid var(--rib);padding:14px;min-width:0}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--chrome);opacity:.55}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.coord{position:absolute;top:3px;right:8px;font-family:var(--f-data);font-size:9px;color:var(--dim);letter-spacing:.1em}

/* arco ojival */
.arch{position:relative;padding-top:0;border:1px solid var(--rib);border-top:0;background:linear-gradient(180deg,rgba(25,18,40,.95),rgba(10,9,16,.95))}
.arch-top{display:block;width:100%;height:46px;margin-bottom:-1px}
.arch-top path.o{fill:rgba(25,18,40,.95);stroke:var(--rib);stroke-width:1.2;vector-effect:non-scaling-stroke}
.arch-top path.i{fill:none;stroke:var(--uv);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke}

.btn{min-height:48px;padding:10px 16px;border:1px solid var(--rib);background:var(--stone);cursor:pointer;font-family:var(--f-data);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--uv)}
.btn.pri{background:linear-gradient(180deg,#5a0d1d,#2e0610);border-color:var(--blood);color:#fff}
.btn.pri:hover{border-color:var(--blood-hi)}
.btn.ghost{background:transparent}
.btn.acidb{border-color:var(--acid);color:var(--acid);background:rgba(164,255,60,.06)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border:1px solid var(--rib);font-family:var(--f-data);font-size:12px;color:var(--mute);background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acid);color:var(--acid)}
.tag{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--rib);color:var(--mute);text-transform:uppercase}
.tag.warn{border-color:#8a6a1a;color:#e6c35a}

/* integridad */
.integ{display:flex;align-items:flex-end;gap:12px}
.integ .big{font-family:var(--f-data);font-size:52px;line-height:.9;color:var(--acid);text-shadow:0 0 18px rgba(164,255,60,.35)}
.bar{height:8px;background:#100e18;border:1px solid var(--rib);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--uv),var(--acid));display:block}
.bar.red i{background:linear-gradient(90deg,var(--blood),var(--blood-hi))}
.rank{display:flex;align-items:center;gap:10px}
.rank svg{width:44px;height:44px;flex:none}
.rank .nm{font-family:var(--f-title);font-size:24px;color:var(--chrome);line-height:1}
.glitch{animation:glitch 600ms steps(6) 1}
@keyframes glitch{0%{transform:translate(0);text-shadow:2px 0 var(--blood-hi),-2px 0 var(--uv)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px);text-shadow:-2px 0 var(--blood-hi),2px 0 var(--uv)}60%{transform:translate(-1px,0)}100%{transform:none;text-shadow:none}}

.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--rib)}
.mission:last-child{border-bottom:0}
.mission .ck{width:22px;height:22px;border:1px solid var(--mute);flex:none;display:grid;place-items:center}
.mission.done .ck{border-color:var(--acid);background:rgba(164,255,60,.15)}
.mission.done .ck::after{content:"";width:10px;height:6px;border-left:2px solid var(--acid);border-bottom:2px solid var(--acid);transform:rotate(-45deg) translate(1px,-1px)}
.mission .t{flex:1;min-width:0}
.mission .t b{font-weight:500}
.mission .t small{display:block;color:var(--mute);font-family:var(--f-data);font-size:11px}

.divider{display:block;width:100%;height:18px;opacity:.7}
.log{font-family:var(--f-data);font-size:12.5px;line-height:1.55;background:#07060c;border:1px solid var(--rib);padding:10px 12px;color:var(--chrome);min-height:84px}
.log .ts{color:var(--dim)} .log .c-err{color:var(--blood-hi)} .log .c-ok{color:var(--acid)} .log .c-warn{color:#e6c35a} .log .c-sys{color:#b48bff}
.log .cur::after{content:"█";animation:blink 1s steps(1) infinite;color:var(--acid);margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* tarjetas de modo */
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px;min-height:96px;border:1px solid var(--rib);background:linear-gradient(180deg,rgba(21,19,31,.9),rgba(10,9,16,.9));cursor:pointer;position:relative;min-width:0}
.mode:hover{border-color:var(--uv)}
.mode .mn{font-family:var(--f-alt);font-size:20px;color:var(--chrome);line-height:1.1}
.mode .md{font-size:13px;color:var(--mute);line-height:1.35}
.mode .mk{align-self:flex-start;order:3}
.mode.locked{opacity:.55}

/* QUIZ */
.q-wrap{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.q-hud{display:flex;align-items:center;gap:10px}
.q-hud .rose{width:58px;height:58px;flex:none}
.q-hud .meta{flex:1;min-width:0;font-family:var(--f-data);font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.q-hud .meta .l1{display:flex;justify-content:space-between;gap:8px}
.q-hud .combo{color:var(--acid);font-size:16px}
.q-hud .clock{font-size:20px;color:var(--ink)}
.q-hud .clock.hot{color:var(--blood-hi)}
.tbar{height:6px;background:#100e18;border:1px solid var(--rib);overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blood),var(--uv));transform-origin:left}
.q-card{position:relative;flex:1 1 auto;min-height:96px;display:flex;flex-direction:column;overflow:hidden}
.q-card .body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 14px 14px;text-align:center;overflow:hidden}
.q-kind{font-family:var(--f-data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--uv);opacity:.9}
.q-big{font-family:var(--f-jp);font-size:clamp(64px,22vw,112px);line-height:1.05;font-weight:700;color:#fff;text-shadow:0 0 22px rgba(138,61,255,.35)}
.q-word{font-family:var(--f-jp);font-size:clamp(34px,10vw,52px);line-height:1.25;font-weight:700;color:#fff}
.q-es{font-size:clamp(22px,6vw,30px);line-height:1.25;color:#fff}
.q-sent{font-family:var(--f-jp);font-size:clamp(19px,5.2vw,24px);line-height:2;color:#fff;text-align:left;max-width:36em}
.q-sent .blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--acid);text-align:center;color:var(--acid)}
.q-sub{color:var(--mute);font-size:14px}
.q-sub.jp{font-family:var(--f-jp);font-size:16px}
ruby rt{font-size:.5em;color:var(--mute);font-family:var(--f-jp)}
body.nofuri rt{display:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:56px;padding:8px 10px 8px 34px;border:1px solid var(--rib);background:linear-gradient(180deg,#14121e,#0c0b13);cursor:pointer;text-align:left;position:relative;font-size:16px;line-height:1.3;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.opt.jp{font-family:var(--f-jp);font-size:19px}
.opt.kj{font-family:var(--f-jp);font-size:30px;text-align:center;padding-left:10px}
.opt .k{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--f-data);font-size:11px;color:var(--dim)}
.opt.kj .k{top:8px;transform:none}
.opt:hover:not(:disabled){border-color:var(--uv)}
.opt.ok{border-color:var(--acid);background:rgba(164,255,60,.12);color:#fff}
.opt.bad{border-color:var(--blood-hi);background:rgba(196,20,47,.18)}
.opt:disabled{cursor:default}
.typein{display:flex;flex-direction:column;gap:8px}
.typein input{min-height:52px;font-family:var(--f-jp);font-size:22px;padding:8px 12px;background:#0b0a12;border:1px solid var(--rib);color:#fff;width:100%}
.typein .kana{font-family:var(--f-jp);font-size:22px;color:var(--acid);min-height:1.4em}
.fb{border:1px solid var(--rib);background:#0a0910;padding:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{border-color:rgba(164,255,60,.5)}
.fb.bad{border-color:rgba(255,58,85,.6)}
.fb .v{font-family:var(--f-data);font-size:13px;letter-spacing:.12em}
.fb .ans{font-family:var(--f-jp);font-size:18px}
.fb .tr{font-size:14px;color:#d9cff7}
.fb .tr b{color:var(--acid);font-weight:500}
.crack{position:absolute;inset:0;pointer-events:none;z-index:0}
.q-card .body{position:relative;z-index:1}
.crack path{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.2;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(255,58,85,.9));stroke-dasharray:400;stroke-dashoffset:400;animation:crack 180ms ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.pause-ov{position:absolute;inset:0;background:rgba(5,5,9,.92);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ghostbar{height:4px;background:#100e18;position:relative}
.ghostbar i{position:absolute;inset:0 auto 0 0;background:#b48bff;opacity:.7}
.ghostbar b{position:absolute;inset:0 auto 0 0;background:var(--acid)}

/* flashcards */
.fc{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.fc .card{width:100%;max-width:440px;min-height:300px;cursor:pointer;transition:transform .18s;user-select:none}
.fc .card.l{transform:translateX(-40px) rotate(-4deg);opacity:.6}
.fc .card.r{transform:translateX(40px) rotate(4deg);opacity:.6}

/* intro card */
.intro .k-big{font-family:var(--f-jp);font-size:96px;line-height:1;font-weight:700;text-align:center;color:#fff;text-shadow:0 0 26px rgba(138,61,255,.4)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;font-family:var(--f-jp);min-width:0}
.ex{font-family:var(--f-jp);font-size:16px;line-height:1.9}
.ex small{display:block;font-family:var(--f-body);color:var(--mute);font-size:13px;line-height:1.3}

/* stats */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-data);font-size:10px;fill:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-family:var(--f-data);font-size:12.5px}
.tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--rib);text-align:left;white-space:nowrap}
.tbl th{color:var(--mute);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.tbl tr.me td{color:var(--acid)}
.tblwrap{overflow-x:auto}
.heat{display:grid;grid-template-columns:minmax(0,1fr) repeat(6,26px);gap:3px;align-items:center;font-family:var(--f-data);font-size:11px}
.heat .c{height:20px;border:1px solid rgba(255,255,255,.04)}

/* biblioteca */
.lib h3{font-family:var(--f-alt);font-size:20px;font-weight:400;color:var(--chrome);margin-top:6px}
.lib .pt{border-left:2px solid var(--uv);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:3px}
.lib .pt .pat{font-family:var(--f-jp);font-size:18px;color:#fff;font-weight:700}
.lib .pt .ex{font-size:15px}
.lib table{border-collapse:collapse;font-size:14px;width:100%}
.lib td,.lib th{border:1px solid var(--rib);padding:6px 8px;vertical-align:top;text-align:left}
.lib th{font-family:var(--f-data);font-size:11px;font-weight:400;letter-spacing:.1em;color:var(--mute)}
.lib .jp{font-family:var(--f-jp)}

/* boot */
#boot{position:fixed;inset:0;z-index:100;background:var(--void);display:flex;flex-direction:column;justify-content:center;padding:24px max(24px,env(safe-area-inset-left,0px));font-family:var(--f-data);color:var(--acid);font-size:14px;gap:6px;cursor:pointer}
#boot .t{font-family:var(--f-title);color:var(--chrome);font-size:40px;margin-bottom:10px}
#boot .skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:24px;color:var(--mute);font-size:11px;letter-spacing:.2em}
#boot.out{opacity:0;transition:opacity .25s;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=date],.field select,textarea{min-height:44px;background:#0b0a12;border:1px solid var(--rib);color:var(--ink);font-family:var(--f-data);font-size:15px;padding:8px 10px;width:100%}
textarea{min-height:120px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#0b0a12;border:1px solid var(--uv);font-family:var(--f-data);font-size:13px;padding:10px 14px;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}
  .crack path{stroke-dashoffset:0}
  .fx-flash.on{animation:none;opacity:.15}
}
body.calm .fx-scan{display:none}
</style>
<div id="boot" role="button" tabindex="0" aria-label="Saltar arranque">
  <div class="t">Sin Falla</div>
  <div id="bootlog"></div>
  <div class="skip">TOCA PARA SALTAR</div>
</div>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="fx-vig"></div><div class="fx-scan"></div><div class="fx-flash" id="flash"></div>
<div id="app">
  <header class="top">
    <div class="brand">Sin <b>Falla</b></div>
    <div class="snd">
      <button class="icon-btn" id="muteBtn" aria-label="Silenciar sonido"></button>
      <input class="vol" id="vol" type="range" min="0" max="100" value="60" aria-label="Volumen">
    </div>
    <div class="count"><span class="d num" id="cdD">--</span> <span class="num mute" id="cdT"></span><small>para el juicio</small></div>
  </header>
  <main class="stage" id="stage" tabindex="-1"></main>
  <nav class="bottom" aria-label="Navegación principal">

ればなりません。夜{よる}11時{じ}からは静{しず}かにしなければなりません。友{とも}だちを部屋{へや}に呼{よ}んでもいいですが、夜{よる}10時{じ}までに帰{かえ}らなければなりません。日曜日{にちようび}は、そうじをしなくてもいいです。","来月、京都へ旅行します。旅行の前に、ホテルを予約しておきました。ガイドブックも買って、読んでおきました。でも、きのうカメラを電車の中に忘れてしまいました。とても悲しいです。京都では、有名な旅館にもとまってみたいです。":"来月{らいげつ}、京都{きょうと}へ旅行{りょこう}します。旅行{りょこう}の前{まえ}に、ホテルを予約{よやく}しておきました。ガイドブックも買{か}って、読{よ}んでおきました。でも、きのうカメラを電車{でんしゃ}の中{なか}に忘{わす}れてしまいました。とても悲{かな}しいです。京都{きょうと}では、有名{ゆうめい}な旅館{りょかん}にもとまってみたいです。","駅のすぐ近くに「いろり」という居酒屋があります。先週、友だちと行ってみました。料理はおいしかったですが、とても高かったです。友だちは「あんなに高い店にはもう行かないほうがいい」と言いました。わたしもそう思います。":"駅{えき}のすぐ近{ちか}くに「いろり」という居酒屋{いざかや}があります。先週{せんしゅう}、友{とも}だちと行{い}ってみました。料理{りょうり}はおいしかったですが、とても高{たか}かったです。友{とも}だちは「あんなに高{たか}い店{みせ}にはもう行{い}かないほうがいい」と言{い}いました。わたしもそう思{おも}います。","ゆき、晩ご飯は冷蔵庫に入れておいたから、温めて食べなさい。肉ばかり食べないで、野菜も食べなさい。ゲームは9時までにしなさい。明日はテストだから、早く寝たほうがいいよ。かぜをひかないように、まどを閉めて寝なさい。母より":"ゆき、晩{ばん}ご飯{はん}は冷蔵庫{れいぞうこ}に入{い}れておいたから、温{あたた}めて食{た}べなさい。肉{にく}ばかり食{た}べないで、野菜{やさい}も食{た}べなさい。ゲームは9時{じ}までにしなさい。明日{あした}はテストだから、早{はや}く寝{ね}たほうがいいよ。かぜをひかないように、まどを閉{し}めて寝{ね}なさい。母{はは}より"},"cov":{"kOk":246,"vOk":1233,"vRev":151,"vS2":25},"built":"2026-10-18"};

function romaToKana(s) {
  s = s.toLowerCase(); let out = '', i = 0;

const ROW = { う: ['わ', 'い', 'う', 'え', 'お'], く: ['か', 'き', 'く', 'け', 'こ'], ぐ: ['が', 'ぎ', 'ぐ', 'げ', 'ご'], す: ['さ', 'し', 'す', 'せ', 'そ'], つ: ['た', 'ち', 'つ', 'て', 'と'], ぬ: ['な', 'に', 'ぬ', 'ね', 'の'], ぶ: ['ば', 'び', 'ぶ', 'べ', 'ぼ'], む: ['ま', 'み', 'む', 'め', 'も'], る: ['ら', 'り', 'る', 'れ', 'ろ'] };

const FORMS = {

function conj(word, group, form) {
  // devuelve string (en la misma escritura que word: kanji+okurigana o kana)
  const w = word;
  if (group === 'v3') {
    const isKuru = /来る$|くる$/.test(w) && (w === '来る' || w === 'くる');
    if (isKuru) {
      const k = w[0] === '来' ? '来' : '';

      return k ? k + R.slice(1) : R;
    }
    const st = w.replace(/する$/, '');
    return st + { dict: 'する', masu: 'します', te: 'して', ta: 'した', nai: 'しない', pot: 'できる', pas: 'される', imp: 'しろ', pro: 'するな', ba: 'すれば', tara: 'したら', vol: 'しよう' }[form];
  }
  if (group === 'v2') {
    const st = w.slice(0, -1);
    if (form === 'imp' && /くれる$/.test(w)) return st;
    return form === 'dict' ? w : form === 'pro' ? w + 'な' : st + { masu: 'ます', te: 'て', ta: 'た', nai: 'ない', pot: 'られる', pas: 'られる', imp: 'ろ', ba: 'れば', tara: 'たら', vol: 'よう' }[form];
  }
  // v1
  const end = w.slice(-1), st = w.slice(0, -1), row = ROW[end];
  if (!row) return w;
  const iku = /行く$|いく$/.test(w) && (w.endsWith('行く') || w === 'いく');
  const te = iku ? st + 'って' : st + TE[end];
  const ta = te.replace(/て$/, 'た').replace(/で$/, 'だ');
  switch (form) {
    case 'dict': return w;
    case 'masu': return st + row[1] + 'ます';
    case 'te': return te;
    case 'ta': return ta;
    case 'nai': return /^(ある|有る|在る)$/.test(w) ? 'ない' : st + row[0] + 'ない';
    case 'pot': return st + row[3] + 'る';
    case 'pas': return st + row[0] + 'れる';
    case 'imp': return st + row[3];
    case 'pro': return w + 'な';
    case 'ba': return st + row[3] + 'ば';
    case 'tara': return ta + 'ら';

function conjWrong(word, group, form) {
  const out = new Set();

    const end = word.slice(-1), st = word.slice(0, -1);
    const alt = { te: [st + 'って', st + 'んで', st + 'いて', st + 'して'], ta: [st + 'った', st + 'んだ', st + 'いた', st + 'した'] }[form];
    if (alt) alt.forEach(a => out.add(a));

  if (sp.g === 'c') return qConj(VBY.get(sp.id), sp.f);
  if (sp.g === 'pa') return qParticle(sp.id);
  if (sp.g === 'cn') return qCounter();
  if (sp.g === 'rd') return qReadingQ(READINGS.find(r => r.id === sp.id), sp.q);
}
// selección ponderada: cripta + vencidos + caja baja
function choose(keys, n, opts = {}) {
  if (!keys.length) return [];
  const cr = keys.filter(k => S.crypt[k]), du = keys.filter(k => due(k) && !S.crypt[k]);
  const rest = keys.filter(k => !S.crypt[k] && !due(k)).sort((a, b) => (S.it[a] ? S.it[a].b : 0) - (S.it[b] ? S.it[b].b : 0));
  const out = [];
  const take = (arr, m) => { for (const k of shuffle(arr)) { if (out.length >= n || m <= 0) break; if (!out.includes(k)) { out.push(k); m--; } } };
  take(cr, Math.ceil(n * 0.3)); take(du, Math.ceil(n * 0.45));
  take(rest.slice(0, Math.max(n * 3, 30)), n);
  while (out.length < n) out.push(pick(keys));
  return shuffle(out).map(k => specFor(k, opts));
}
function introducedPool(filter = {}) {
  let keys = S.intro.filter(k => /^[vkg]:/.test(k));
  // gramática: preguntas de puntos presentados
  const pts = new Set(S.intro.filter(k => k.startsWith('p:')).map(k => k.slice(2)));
  const gk = G.filter(g => pts.has(g.pt)).map(g => 'g:' + g.id);
  keys = keys.filter(k => k[0] !== 'g').concat(gk);
  if (filter.only) keys = keys.filter(k => filter.only.includes(k[0]));
  if (filter.pt) keys = keys.filter(k => k[0] !== 'g' || filter.pt.includes(GBY.get(k.slice(2)).pt));
  if (filter.trap) keys = keys.filter(k => k[0] !== 'g' || GBY.get(k.slice(2)).f.includes('T'));
  if (filter.theme) keys = keys.filter(k => k[0] !== 'v' || VBY.get(+k.slice(2)).th === filter.theme);
  if (filter.week) keys = keys.filter(k => k[0] !== 'v' || VBY.get(+k.slice(2)).wk === filter.week);
  if (filter.lv) keys = keys.filter(k => (k[0] === 'v' ? VBY.get(+k.slice(2)).lv : k[0] === 'k' ? KBY.get(k.slice(2)).lv : filter.lv) === filter.lv);
  if (filter.crypt) keys = keys.filter(k => S.crypt[k]).concat(Object.keys(S.crypt).filter(k => /^(c|pa|cn):/.test(k)));
  return keys;
}

}

function renderCrypt() {

  const tot = Object.values(causes).reduce((a, b) => a + b, 0) || 1;

  <p class="mute" style="font-size:13px">Fuentes: listas JLPT de Jonathan Waller (tanos.co.uk, CC BY) vía open-anki-jlpt-decks y yomitan-jlpt-vocab (cruzada con JMdict); KANJIDIC2 (EDRDG, CC BY-SA) para lecturas; niveles de kanji cruzados con kanji-data (Waller) y jlpt-kanji-dictionary. Traducciones al español, trucos y frases de ejemplo escritos para esta app; furigana generado con kuromoji (IPADIC) y corregido a mano. Datos: ${esc(DATA.built)}.</p>`;
}

  $('#mb').onclick = render; stage().scrollTop = 0;
}
function renderSettings() {
  const c = S.cfg;
  stage().innerHTML = `<div class="col"><button class="btn ghost" id="mb">← Volver</button><h1 class="h-title">Ajustes</h1>
  <div class="panel col">
    <div class="field"><label class="lbl" for="exd">Fecha del examen</label><input type="date" id="exd" value="${esc(c.exam || todayKey(examDate()))}"></div>
    <div class="field"><label class="lbl" for="dif">Dificultad del reloj</label><select id="dif"><option value="normal">Normal · 15 s por pregunta</option><option value="dura">Dura · 10 s</option><option value="brutal">Brutal · 6 s</option></select><span class="mute" style="font-size:13px">Acierto "rápido" = antes del 60% del tiempo. Solo los rápidos cuentan para dominar.</span></div>
    <div class="row"><button class="chip" id="fu" aria-pressed="${!!c.furi}">Furigana</button><button class="chip" id="sn" aria-pressed="${!!c.snd}">Sonido</button><button class="chip" id="cl" aria-pressed="${!!c.calm}">Efectos reducidos</button><button class="chip" id="vt">Probar voz</button></div>
    <div class="mono mute" style="font-size:12px" id="cloudState">${dbDoc ? 'sincronizado en la nube' : 'guardado en este navegador (la nube no respondió)'}</div>
  </div>
  <div class="panel col"><div class="lbl">Progreso</div>
    <div class="grid2"><button class="btn" id="ex">Exportar JSON</button><button class="btn" id="im">Importar JSON</button></div>
    <textarea id="io" placeholder="Pega aquí un JSON exportado y pulsa Importar" aria-label="JSON de progreso"></textarea>
    <input type="file" id="imf" accept="application/json,.json" aria-label="Archivo JSON">
    <button class="btn ghost" id="rs">Borrar todo el progreso</button><div id="rsc"></div></div></div>`;
  $('#dif').value = c.diff; $('#mb').onclick = render;
  $('#exd').onchange = e => { c.exam = e.target.value; delete (S.plan || {})[todayKey()]; save(); header(); };
  $('#dif').onchange = e => { c.diff = e.target.value; save(); };
  const tog = (id, k, fn) => $(id).onclick = () => { c[k] = c[k] ? 0 : 1; $(id).setAttribute('aria-pressed', !!c[k]); fn && fn(); save(); };
  tog('#fu', 'furi', applyCfg); tog('#sn', 'snd', () => { SND.init(); SND.setVol(); paintMute(); }); tog('#cl', 'calm', applyCfg);
  $('#vt').onclick = () => speak('日本語の勉強をしましょう。');
  $('#ex').onclick = async () => {
    const data = JSON.stringify(S); $('#io').value = data;
    try { const dl = window.claude && await claude.use('downloads'); if (dl) { await dl.save({ filename: 'sinfalla-n4-progreso-' + todayKey() + '.json', data }); return; } } catch (e) { }
    $('#io').select(); toast('JSON listo en el cuadro: cópialo y guárdalo.');
  };
  const doImport = txt => { try { const o = JSON.parse(txt); if (!o.it || !o.cfg) throw 0; mergeState(o); save(true); applyCfg(); toast('Progreso importado.'); render(); } catch (e) { toast('Ese JSON no es un progreso válido de Sin Falla.'); } };
  $('#im').onclick = () => doImport($('#io').value);
  $('#imf').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); };
  $('#rs').onclick = () => { $('#rsc').innerHTML = `<p class="red">Se borrará todo: ítems, cripta, récords. No se puede deshacer.</p><button class="btn pri block" id="rsy">Sí, borrar todo</button>`; $('#rsy').onclick = () => { const cfg = S.cfg; for (const k of ['it', 'crypt', 'rec', 'hist', 'acc', 'days', 'guard', 'plan']) S[k] = {}; S.intro = []; S.finals = []; S.ghost = null; S.xp = 0; S.streak = 0; S.log = []; S.diag = null; S.cfg = cfg; save(true); toast('Progreso borrado.'); render(); }; };
}
function applyCfg() { document.body.classList.toggle('nofuri', !S.cfg.furi); document.body.classList.toggle('calm', !!S.cfg.calm); BG.setCalm(reduceMotion()); }
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 010 8M19 5a9 9 0 010 14"/></svg>', ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintMute() { $('#muteBtn').innerHTML = S.cfg.snd ? ICON_ON : ICON_OFF; $('#muteBtn').setAttribute('aria-label', S.cfg.snd ? 'Silenciar sonido' : 'Activar sonido'); $('#vol').value = S.cfg.vol; }

// ================= FONDO: rejilla de neón, niebla, partículas y lluvia de kana =================
const BG = (() => {
  const cv = $('#bg'), cx = cv.getContext('2d'); let W = 0, H = 0, dpr = 1, t = 0, calm = false, raf = 0, last = 0;
  const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん漢字日本語忘待持午牛買売';
  let drops = [], parts = [];
  function size() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); drops = Array.from({ length: Math.ceil(W / 46) }, (_, i) => ({ x: i * 46 + 10, y: Math.random() * H, v: 18 + Math.random() * 30, c: KANA[rnd(KANA.length)] })); parts = Array.from({ length: 34 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, v: 4 + Math.random() * 10 })); }
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000 || 0.016); last = now; t += dt;
    cx.fillStyle = '#050509'; cx.fillRect(0, 0, W, H);
    // halo violeta superior (rosetón lejano)
    const g = cx.createRadialGradient(W / 2, H * 0.18, 10, W / 2, H * 0.18, Math.max(W, H) * 0.6); g.addColorStop(0, 'rgba(138,61,255,.16)'); g.addColorStop(.5, 'rgba(196,20,47,.05)'); g.addColorStop(1, 'rgba(0,0,0,0)'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // lluvia de kana
    cx.font = '15px "Shippori Mincho", serif'; cx.textAlign = 'center';
    for (const d of drops) { if (!calm) { d.y += d.v * dt; if (d.y > H + 20) { d.y = -20; d.c = KANA[rnd(KANA.length)]; } } cx.fillStyle = 'rgba(164,255,60,.07)'; cx.fillText(d.c, d.x, d.y); cx.fillStyle = 'rgba(180,139,255,.05)'; cx.fillText(KANA[(d.x | 0) % KANA.length], d.x, d.y - 22); }
    // rejilla en perspectiva
    const hz = H * 0.62; cx.strokeStyle = 'rgba(138,61,255,.22)'; cx.lineWidth = 1;
    for (let i = -12; i <= 12; i++) { cx.beginPath(); cx.moveTo(W / 2 + i * 8, hz); cx.lineTo(W / 2 + i * W * 0.22, H); cx.stroke(); }
    const off = calm ? 0 : (t * 0.35) % 1;
    for (let j = 0; j < 14; j++) { const p = (j + off) / 14, y = hz + (H - hz) * p * p; cx.strokeStyle = `rgba(196,20,47,${0.05 + p * 0.22})`; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    // niebla baja
    const f = cx.createLinearGradient(0, hz - 40, 0, H); f.addColorStop(0, 'rgba(5,5,9,0)'); f.addColorStop(.55, 'rgba(20,14,34,.55)'); f.addColorStop(1, 'rgba(5,5,9,.92)'); cx.fillStyle = f; cx.fillRect(0, hz - 40, W, H - hz + 40);
    // partículas (polvo de vitral)
    for (const p of parts) { if (!calm) { p.y -= p.v * dt; p.x += Math.sin(t + p.y * .01) * .2; if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } } cx.fillStyle = 'rgba(201,204,216,.35)'; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); }
    if (!calm && !document.hidden) raf = setTimeout(() => requestAnimationFrame(frame), 33);
  }
  function setCalm(c) { calm = c; clearTimeout(raf); requestAnimationFrame(frame); }
  addEventListener('resize', () => { size(); if (calm) requestAnimationFrame(frame); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !calm) { clearTimeout(raf); requestAnimationFrame(frame); } });
  size();
  return { setCalm };
})();

// ================= ARRANQUE =================
function boot() {
  const b = $('#boot'), lg = $('#bootlog');
  const dl = daysLeft();
  const lines = ['> iniciando ritual...', '> cargando ' + K.length + ' kanji · ' + V.length + ' palabras · ' + G.length + ' preguntas', '> sincronizando ' + Math.max(0, dl) + ' días para el juicio', '> integridad: ' + readiness().pct.toFixed(1) + '%'];
  let i = 0; const done = () => { if (b.classList.contains('out')) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); };
  const step = () => { if (i < lines.length) { const d = document.createElement('div'); d.textContent = lines[i++]; lg.appendChild(d); setTimeout(step, reduceMotion() ? 0 : 320); } else setTimeout(done, 350); };
  b.onclick = done; b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') done(); };
  step(); setTimeout(done, 2000);
}

  stage().innerHTML = `<div class="col"><h1 class="h-title">Bienvenida al ritual</h1>

    <div class="field"><label class="lbl" for="fx">¿Cuándo es tu examen N4?</label><input type="date" id="fx" value="${todayKey(new Date(Date.now() + 30 * DAY))}"></div>
    <div class="field"><label class="lbl" for="fd">Reloj</label><select id="fd"><option value="normal">Normal · 15 s</option><option value="dura">Dura · 10 s</option><option value="brutal">Brutal · 6 s</option></select></div>
    <button class="btn pri block" id="fgo">Empezar con el diagnóstico</button>
    <button class="btn ghost block" id="fskip">Saltar diagnóstico e ir a Iniciación</button>
  </div></div>${logHTML([{ ts: hhmmss(), code: 'SYS 0x00', text: 'Sistema en blanco. El espejo empieza a observar.', cls: 'c-sys' }])}</div>`;
  const fin = () => { S.cfg.exam = $('#fx').value; S.cfg.diff = $('#fd').value; S.cfg.setup = 1; save(true); header(); };
  $('#fgo').onclick = () => { fin(); startDiag(); };
  $('#fskip').onclick = () => { fin(); startIntro(); };
}
window.onCloudLoaded = () => { applyCfg(); paintMute(); if (!document.body.classList.contains('inq')) render(); };
(function main() {
  const local = loadLocal(); if (local) mergeState(local);
  S.lastSeenPrev = S.lastSeen || Date.now();
  initVoice(); applyCfg(); paintMute(); header(); buildQueue();
  $$('nav.bottom button').forEach(b => b.onclick = () => { if (SES && !SES.done && document.body.classList.contains('inq')) { SES.done = true; cancelAnimationFrame(SES.raf); } setTab(b.dataset.tab); });
  $('#muteBtn').onclick = () => { S.cfg.snd = S.cfg.snd ? 0 : 1; SND.init(); SND.setVol(); paintMute(); save(); };
  $('#vol').oninput = e => { S.cfg.vol = +e.target.value; SND.init(); SND.setVol(); save(); };
  setInterval(header, 60000);
  boot();
  if (!S.cfg.setup) { $$('nav.bottom button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === 'hoy' ? 'page' : 'false')); firstRun(); }
  else setTab('hoy');
  initCloud();
})();
